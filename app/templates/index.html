<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Tracker</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#6b7280; --accent:#2563eb; --line:#e5e7eb; --danger:#dc2626; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); }
    main { max-width: 560px; margin: 48px auto; padding: 0 16px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:24px; }
    h1 { margin:0 0 4px; font-size:1.5rem; }
    #summary { color:var(--muted); margin:0 0 20px; }
    form { display:flex; gap:8px; }
    input[type=text] { flex:1; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:1rem; }
    button { padding:10px 16px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:1rem; cursor:pointer; }
    #error { color:var(--danger); min-height:1.25em; margin:8px 0 0; font-size:.9rem; }
    ul { list-style:none; padding:0; margin:16px 0 0; }
    li { display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line); }
    li.done span { text-decoration: line-through; color:var(--muted); }
    li span { flex:1; overflow-wrap:anywhere; }
    li button { background:none; color:var(--danger); padding:4px 8px; }
    footer { text-align:center; color:var(--muted); font-size:.8rem; margin-top:16px; }
  </style>
</head>
<body>
<main>
  <div class="card">
    <h1>Kaustubh's Task Tracker</h1>
    <p id="summary" data-testid="summary">No tasks yet</p>
    <form id="new-task" data-testid="new-task-form">
      <input id="title" data-testid="title-input" type="text" placeholder="What needs doing?" aria-label="Task title" autocomplete="off">
      <button type="submit" data-testid="add-button">Add</button>
    </form>
    <p id="error" data-testid="error" role="alert"></p>
    <ul id="tasks" data-testid="task-list"></ul>
  </div>
  <footer data-testid="version">version {{ version }}</footer>
</main>
<script>
  const list = document.getElementById('tasks');
  const errorEl = document.getElementById('error');
  const input = document.getElementById('title');

  async function load() {
    const res = await fetch('/api/tasks');
    const { tasks, summary } = await res.json();
    document.getElementById('summary').textContent =
      summary.total ? `${summary.done} of ${summary.total} done` : 'No tasks yet';
    list.innerHTML = '';
    for (const t of tasks) {
      const li = document.createElement('li');
      li.dataset.testid = 'task';
      li.className = t.done ? 'done' : '';
      const box = document.createElement('input');
      box.type = 'checkbox';
      box.checked = t.done;
      box.setAttribute('aria-label', `Mark "${t.title}" done`);
      box.onchange = () => api('PATCH', `/api/tasks/${t.id}`, { done: box.checked });
      const span = document.createElement('span');
      span.textContent = t.title;
      const del = document.createElement('button');
      del.textContent = 'Delete';
      del.setAttribute('aria-label', `Delete "${t.title}"`);
      del.onclick = () => api('DELETE', `/api/tasks/${t.id}`);
      li.append(box, span, del);
      list.append(li);
    }
  }

  async function api(method, url, body) {
    const res = await fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (!res.ok) {
      errorEl.textContent = (await res.json()).error;
      return false;
    }
    errorEl.textContent = '';
    await load();
    return true;
  }

  document.getElementById('new-task').onsubmit = async (e) => {
    e.preventDefault();
    // Clear the box straight away so the user can type the next task,
    // and put the text back only if saving failed.
    const title = input.value;
    input.value = '';
    if (!(await api('POST', '/api/tasks', { title }))) input.value = title;
  };

  load();
</script>
</body>
</html>
