name: Release

# Runs when you push a version tag, e.g.:  git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*.*.*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the GitHub Release
      packages: write     # push the Docker image
    steps:
      - uses: actions/checkout@v7
      - name: Build and push versioned image
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          VERSION=${GITHUB_REF_NAME}
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build --build-arg APP_VERSION=$VERSION -t $IMAGE:$VERSION .
          docker push $IMAGE:$VERSION
      - name: Create GitHub Release with auto-generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
